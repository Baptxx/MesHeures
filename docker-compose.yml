services:
  backend:
    build: ./backend
    restart: unless-stopped
    volumes:
      - db_data:/data
    environment:
      - DB_PATH=/data/mesheures.db
    networks:
      - internal

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=/mesheures
    restart: unless-stopped
    networks:
      - internal
      - proxy

networks:
  internal:
  proxy:
    external: true

volumes:
  db_data:
