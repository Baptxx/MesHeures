server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy API vers le backend
    location ~ ^/mesheures/(entries|health) {
        rewrite ^/mesheures/(.*) /$1 break;
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA fallback
    location /mesheures/ {
        try_files $uri $uri/ /mesheures/index.html;
    }
}
